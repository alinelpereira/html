<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Grão Dourado — CSS Interno</title>
  <!--
    FORMA 2: CSS INTERNO
    O estilo fica reunido na tag <style>, dentro do <head>.
      -->
  <style>
    header {
        background-color: #f5deb3;

    }
    header h1 {
        color: #8b4513;
       margin: 0;
       padding: 10px;
       font-family: Comic Sans MS, cursive, sans-serif;
       text-align: center;
    }
    header p {
        color: #8b4513;
        margin: 0;
        padding: 5px;
        font-family: Arial, sans-serif;
        text-align: center;
    }
    body {
        background-color: #fff8dc;
    
   
    }
    main {
        padding: 20px;
        width: 400px;
        margin:  auto;
    }
    main h2{
        text-align: center;
        color: #8b4513;
        font-family:Arial, Helvetica, sans-serif, sans-serif;
    }
    section {
        background-color: #f5f5dc;
        border: 1px solid #deb887;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 10px;
    }
    section h3 {
        color: #8b4513;
        margin: 0;
        font-family: Georgia, serif;
    }
    section p {
        color: #8b4513;
        margin: 16px 0 0 0;
        font-family: Verdana, sans-serif;
    }
    footer {
        background-color: #f5deb3;
        color: #8b4513;
        text-align: center;
        padding: 10px;
        font-family: 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>

  <header>
    <h1>☕ Cafeteria Grão Dourado</h1>
    <p>O melhor café de Suzano</p>
  </header>

  <main>
    <h2>Nosso cardápio</h2>

    <section>
      <h3>Espresso</h3>
      <p>Café curto e intenso. R$ 6,00</p>
    </section>

    <section>
      <h3>Cappuccino</h3>
      <p>Café, leite vaporizado e canela. R$ 9,50</p>
    </section>

    <section>
      <h3>Pão de queijo</h3>
      <p>Quentinho, saído do forno. R$ 5,00</p>
    </section>
  </main>

  <footer>
    Exemplo de aula — CSS Interno
  </footer>

</body>
</html>
