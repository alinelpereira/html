<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Grão Dourado — Class e ID</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
<img src="./logoLivraria.png" alt="LogoLivraria">
<h1 style="text-align: center; background-color: rgb(87, 8, 63); color: rgb(247, 232, 232);">Livraria 📖</h1>

    <!-- CLASSE + ID: herda o visual de .card e o ID sobrescreve o que muda -->
    <div class="card" id="promo-dia">
      <h4>Promoção do dia</h4>
      <p> Dois livros por R$ 25,00</p>
    </div>

    <!-- SÓ A CLASSE BASE -->
    <div class="card">
      <h4>Romance 💕</h4>
      <p> Hipótese do amor</p>
      <p> Para todos os garotos que ja amei</p>
      <p> É assim que acaba</p>
    </div>

    <!-- DUAS CLASSES: card + destaque (separadas por espaço) -->
    <div class="card destaque">
      <h4>Suspense 🔍</h4>
      <p> verity</p>
      <p> Jantar Secreto</p>
      <p> E não sobrou nenhum</p>
    </div>

    <!-- DUAS CLASSES: card + esgotado -->
    <div class = "card esgotado">
      <h4>Ficção 📚</h4>
      <p>Volta amanhã! </p>
      <p> Torto erado</p>
      <p> A metamorfose</p>
      <p> A biblioteca da Meia-Noite</p>
    </div>
  </main>
<a href="../index.html"><button style="background-color: #530934; color: #f7e8e8; border:3px solid #ffffff; border-radius: 20px; width: 70px; height: 40px;"> voltar </button>
</body>
</html>
